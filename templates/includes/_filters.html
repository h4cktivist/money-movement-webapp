<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-funnel"></i> Фильтры</h5>
    </div>
    <div class="card-body">
        <form method="get" class="row g-3" id="filter-form">
            <div class="col-md-2">
                <label for="date_from" class="form-label">Дата с</label>
                <input type="date" class="form-control" id="date_from" name="date_from"
                       value="{{ request.GET.date_from }}">
            </div>
            <div class="col-md-2">
                <label for="date_to" class="form-label">Дата по</label>
                <input type="date" class="form-control" id="date_to" name="date_to"
                       value="{{ request.GET.date_to }}">
            </div>
            <div class="col-md-2">
                <label for="status" class="form-label">Статус</label>
                <select class="form-select" id="status" name="status">
                    <option value="">Все</option>
                    {% for status in statuses %}
                    <option value="{{ status.pk }}"
                            {% if request.GET.status == status.pk|stringformat:"s" %}selected{% endif %}>
                        {{ status.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label for="transaction_type" class="form-label">Тип</label>
                <select class="form-select" id="transaction_type" name="transaction_type">
                    <option value="">Все</option>
                    {% for type in transaction_types %}
                    <option value="{{ type.pk }}"
                            {% if request.GET.transaction_type == type.pk|stringformat:"s" %}selected{% endif %}>
                        {{ type.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label for="category" class="form-label">Категория</label>
                <select class="form-select" id="category" name="category">
                    <option value="">Все</option>
                    {% for category in categories %}
                    <option value="{{ category.pk }}"
                            data-transaction-type="{{ category.transaction_type.pk }}"
                            {% if request.GET.category == category.pk|stringformat:"s" %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label for="subcategory" class="form-label">Подкатегория</label>
                <select class="form-select" id="subcategory" name="subcategory">
                    <option value="">Все</option>
                    {% for subcategory in subcategories %}
                    <option value="{{ subcategory.pk }}"
                            data-category="{{ subcategory.category.pk }}"
                            {% if request.GET.subcategory == subcategory.pk|stringformat:"s" %}selected{% endif %}>
                        {{ subcategory.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel"></i> Применить
                    </button>
                    <a href="{% url 'transaction_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-counterclockwise"></i> Сбросить
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    function filterCategories() {
        var selectedType = $('#transaction_type').val();
        if (selectedType) {
            $('#category option').each(function() {
                var $option = $(this);
                if ($option.val() === "" || $option.data('transaction-type') == selectedType) {
                    $option.show();
                } else {
                    $option.hide();
                    if ($option.prop('selected')) {
                        $('#category').val('');
                        filterSubcategories();
                    }
                }
            });
        } else {
            $('#category option').show();
        }
    }

    function filterSubcategories() {
        var selectedCategory = $('#category').val();
        if (selectedCategory) {
            $('#subcategory option').each(function() {
                var $option = $(this);
                if ($option.val() === "" || $option.data('category') == selectedCategory) {
                    $option.show();
                } else {
                    $option.hide();
                    if ($option.prop('selected')) {
                        $('#subcategory').val('');
                    }
                }
            });
        } else {
            $('#subcategory option').show();
        }
    }

    filterCategories();
    filterSubcategories();

    $('#transaction_type').change(function() {
        filterCategories();
        filterSubcategories();
    });

    $('#category').change(function() {
        filterSubcategories();
    });

    $('#filter-form').submit(function() {
        $('#category option').prop('disabled', function() {
            return $(this).css('display') === 'none';
        });
        $('#subcategory option').prop('disabled', function() {
            return $(this).css('display') === 'none';
        });
    });
});
</script>
