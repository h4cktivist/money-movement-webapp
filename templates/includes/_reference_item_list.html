{% if items %}
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Название</th>
                <th>Теги</th>
                <th class="text-end">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>
                    {% if item.transaction_type %}
                        <span class="badge bg-secondary">{{ item.transaction_type }}</span>
                    {% elif item.category %}
                        <span class="badge bg-info text-dark">{{ item.category }}</span>
                        <span class="badge bg-secondary">{{ item.category.transaction_type }}</span>
                    {% endif %}
                </td>
                <td class="text-end">
                    <div class="btn-group btn-group-sm">
                        <a href="{% url 'edit_reference_item' model_name item.pk %}"
                           class="btn btn-outline-primary"
                           title="Редактировать">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="{% url 'delete_reference_item' model_name item.pk %}"
                           class="btn btn-outline-danger"
                           title="Удалить"
                           onclick="return confirm('Вы уверены, что хотите удалить этот элемент?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="alert alert-info">
    <i class="bi bi-info-circle"></i> Нет элементов для отображения
</div>
{% endif %}
